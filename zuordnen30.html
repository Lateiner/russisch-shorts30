<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch Lernen - Drag & Drop Zuordnung</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --selected-color: #f1c40f;
            --text-color: #333;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .matching-container {
            background-color: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 25px;
            width: 100%;
            max-width: 700px;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .instruction {
            text-align: center;
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* Das Spielraster */
        .game-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
            position: relative;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .column-header {
            font-weight: bold;
            text-align: center;
            color: #888;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .item {
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Interaktionszustände */
        .item:hover:not(.matched):not(.selected) {
            border-color: var(--primary-color);
            background-color: #f9fbfd;
        }

        .item.selected {
            border-color: var(--selected-color);
            background-color: #fef9e7;
            transform: scale(1.02);
        }

        .item.matched {
            border-color: var(--success-color);
            background-color: #e8f8f0;
            color: #27ae60;
            cursor: default;
        }

        .item.wrong {
            border-color: var(--error-color);
            background-color: #fde8e8;
            animation: shake 0.4s ease;
        }

        /* Feedback Bereich */
        .feedback {
            text-align: center;
            font-weight: bold;
            min-height: 25px;
            margin-bottom: 15px;
            font-size: 1rem;
        }
        .feedback.success { color: var(--success-color); }
        .feedback.error { color: var(--error-color); }

        .btn-reset {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            display: none;
        }

        .btn-reset:hover {
            background-color: #357abd;
        }

        /* Schütteleffekt bei Fehlern */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* Responsives Design für kleinere Bildschirme */
        @media (max-width: 550px) {
            .game-grid {
                grid-template-columns: 1fr; /* Spalten werden untereinander gestapelt */
                gap: 25px;
            }
            
            .column-header {
                margin-bottom: 2px;
            }

            /* Optische Trennungslinie im mobilen Zustand */
            .column:first-child {
                border-bottom: 2px dashed #e0e0e0;
                padding-bottom: 20px;
            }
            
            .item {
                font-size: 1rem;
                padding: 12px;
                min-height: 50px;
            }
        }
    </style>
</head>
<body>

<div class="matching-container">
    <h2>Vokabeln verbinden</h2>
    <div class="instruction">Tippe zuerst ein russisches Wort an und danach die passende deutsche Bedeutung!</div>

    <div class="game-grid">
        <!-- Russische Spalte -->
        <div class="column" id="ru-column">
            <div class="column-header">Russisch</div>
            <!-- Wird per JS befüllt -->
        </div>

        <!-- Deutsche Spalte -->
        <div class="column" id="de-column">
            <div class="column-header">Deutsch</div>
            <!-- Wird per JS befüllt -->
        </div>
    </div>

    <div class="feedback" id="feedback-box"></div>
    <button class="btn-reset" id="reset-btn" onclick="initGame()">Nochmal spielen</button>
</div>

<script>
    // Die Datenstruktur mit Paaren und ID-Zuweisung
    const pairs = [
        { id: 1, ru: "окно", de: "Freistunde (Uni-Alltag)" },
        { id: 2, ru: "пары", de: "Doppelstunden (90 Min.)" },
        { id: 3, ru: "окно", de: "Fenster (Normaler Alltag)" }, // Eingebauter Ablenker laut Konzept
        { id: 4, ru: "пары", de: "Paare (Normaler Alltag)" }    // Eingebauter Ablenker laut Konzept
    ];

    // Da "окно" und "пары" doppelt vorkommen, mappen wir die korrekten ID-Verbindungen eindeutig:
    // id 1 gehört zu de-text "Freistunde...", id 3 gehört zu de-text "Fenster..." usw.
    const dataset = [
        { id: 1, ru: "окно", de: "Freistunde (Uni-Alltag)" },
        { id: 2, ru: "пары", de: "Doppelstunden (90 Min.)" },
        { id: 3, ru: "окно (обычное значение)", de: "Fenster (Gebäude)" },
        { id: 4, ru: "пары (обычное значение)", de: "Paare (z.B. Schuhe)" }
    ];

    let selectedRu = null;
    let selectedDe = null;
    let matchedCount = 0;

    // Hilfsfunktion zum Mischen von Arrays (Fisher-Yates)
    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function initGame() {
        matchedCount = 0;
        selectedRu = null;
        selectedDe = null;
        
        document.getElementById("feedback-box").innerText = "";
        document.getElementById("feedback-box").className = "feedback";
        document.getElementById("reset-btn").style.display = "none";

        const ruColumn = document.getElementById("ru-column");
        const deColumn = document.getElementById("de-column");

        // Header erhalten, alte Items löschen
        ruColumn.innerHTML = '<div class="column-header">Russisches Wort</div>';
        deColumn.innerHTML = '<div class="column-header">Deutsche Bedeutung</div>';

        // Listen getrennt voneinander mischen
        const shuffledRu = shuffle([...dataset]);
        const shuffledDe = shuffle([...dataset]);

        // Russische Elemente rendern
        shuffledRu.forEach(item => {
            const div = document.createElement("div");
            div.className = "item";
            div.innerText = item.ru;
            div.dataset.id = item.id;
            div.onclick = () => selectItem(div, 'ru');
            ruColumn.appendChild(div);
        });

        // Deutsche Elemente rendern
        shuffledDe.forEach(item => {
            const div = document.createElement("div");
            div.className = "item";
            div.innerText = item.de;
            div.dataset.id = item.id;
            div.onclick = () => selectItem(div, 'de');
            deColumn.appendChild(div);
        });
    }

    function selectItem(element, side) {
        if (element.classList.contains('matched') || element.classList.contains('wrong')) return;

        // Vorherige Auswahl auf derselben Seite aufheben
        if (side === 'ru') {
            if (selectedRu) selectedRu.classList.remove('selected');
            selectedRu = element;
        } else {
            if (selectedDe) selectedDe.classList.remove('selected');
            selectedDe = element;
        }

        element.classList.add('selected');

        // Wenn von beiden Seiten etwas gewählt wurde, prüfen
        if (selectedRu && selectedDe) {
            checkMatch();
        }
    }

    function checkMatch() {
        const idRu = selectedRu.dataset.id;
        const idDe = selectedDe.dataset.id;
        const feedbackBox = document.getElementById("feedback-box");

        if (idRu === idDe) {
            // Richtig gelöst
            selectedRu.classList.remove('selected');
            selectedDe.classList.remove('selected');
            selectedRu.classList.add('matched');
            selectedDe.classList.add('matched');
            
            feedbackBox.innerText = "✓ Richtig zugeordnet!";
            feedbackBox.className = "feedback success";
            
            selectedRu = null;
            selectedDe = null;
            matchedCount++;

            if (matchedCount === dataset.length) {
                feedbackBox.innerText = "🎉 Großartig! Alles richtig gelöst.";
                document.getElementById("reset-btn").style.display = "block";
            }
        } else {
            // Falsch zugeordnet
            const tmpRu = selectedRu;
            const tmpDe = selectedDe;
            
            tmpRu.classList.add('wrong');
            tmpDe.classList.add('wrong');
            feedbackBox.innerText = "⚡ Das passt nicht zusammen. Probier es nochmal!";
            feedbackBox.className = "feedback error";

            selectedRu.classList.remove('selected');
            selectedDe.classList.remove('selected');
            selectedRu = null;
            selectedDe = null;

            // Nach der Schüttelanimation Fehlerzustand zurücksetzen
            setTimeout(() => {
                tmpRu.classList.remove('wrong');
                tmpDe.classList.remove('wrong');
            }, 400);
        }
    }

    // Spiel beim Laden starten
    window.onload = initGame;
</script>

</body>
</html>
