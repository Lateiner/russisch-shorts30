<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch Lernen - Hotspot Stundenplan</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --text-color: #333;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 25px;
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 1.4rem;
        }

        .progress-text {
            text-align: center;
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .instruction {
            text-align: center;
            color: #555;
            font-size: 1rem;
            margin-bottom: 25px;
            background: #eef4fa;
            padding: 12px;
            border-radius: 8px;
            font-weight: 500;
        }

        /* Der interaktive Stundenplan */
        .timetable {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        /* Einzelne Zeile im Stundenplan */
        .time-slot {
            display: flex;
            background: #fff;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* Neutraler Hover-Effekt ohne Farbhinterlegung vor dem Klick */
        .time-slot:hover:not(.disabled) {
            border-color: #94a3b8;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        /* Die linke Spalte für die Uhrzeit/Nummer */
        .slot-number {
            background-color: #f1f5f9;
            padding: 15px;
            font-weight: bold;
            color: #64748b;
            min-width: 90px;
            text-align: center;
            border-right: 2px solid #cbd5e1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .slot-time {
            font-size: 0.75rem;
            font-weight: normal;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* Die rechte Spalte für das Fach */
        .slot-subject {
            flex: 1;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            color: #1e293b;
        }

        /* ZUSTÄNDE ERST NACH DEM ANKLICKEN */
        .time-slot.correct-hit {
            border-color: var(--success-color) !important;
            background-color: #e8f8f0;
        }
        .time-slot.correct-hit .slot-number {
            background-color: #d1f2de;
            border-right-color: var(--success-color);
            color: #1e7e34;
        }
        .time-slot.correct-hit .slot-subject {
            color: #1e7e34;
            font-weight: bold;
        }

        .time-slot.wrong-hit {
            border-color: var(--error-color) !important;
            background-color: #fde8e8;
            animation: shake 0.3s ease;
        }
        .time-slot.wrong-hit .slot-number {
            background-color: #fbcbc4;
            border-right-color: var(--error-color);
            color: #bd2130;
        }
        .time-slot.wrong-hit .slot-subject {
            color: #bd2130;
        }

        /* Feedback-Nachricht */
        .feedback-box {
            text-align: center;
            font-weight: bold;
            min-height: 25px;
            margin-bottom: 20px;
            font-size: 1.05rem;
        }
        .feedback-box.success { color: var(--success-color); }
        .feedback-box.error { color: var(--error-color); }

        /* Steuerungstasten */
        .action-zone {
            display: flex;
            gap: 15px;
        }

        .btn-control {
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }

        .btn-reset {
            background-color: #e2e8f0;
            color: #475569;
            flex: 1;
        }

        .btn-reset:hover {
            background-color: #cbd5e1;
        }

        .btn-next {
            background-color: var(--primary-color);
            color: white;
            flex: 2;
            display: none;
        }

        .btn-next:hover {
            background-color: #357abd;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        /* Responsive Anpassung für schmale Smartphones */
        @media (max-width: 440px) {
            .quiz-container { padding: 15px; }
            .slot-number { padding: 10px; min-width: 75px; font-size: 0.9rem; }
            .slot-subject { padding: 10px; font-size: 0.95rem; }
            .instruction { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h2>Interaktiver Stundenplan</h2>
    <div class="progress-text" id="progress-info">Plan 1 von 3</div>
    <div class="instruction">Wo befindet sich das окно? Klicke direkt auf die Lücke im Stundenplan!</div>

    <!-- Der Stundenplan-Hotspot-Bereich -->
    <div class="timetable" id="timetable-box">
        <!-- Wird dynamisch per JavaScript befüllt -->
    </div>

    <div class="feedback-box" id="feedback-zone"></div>

    <div class="action-zone">
        <button class="btn-control btn-reset" onclick="restartQuiz()">Neustart</button>
        <button class="btn-control btn-next" id="next-btn" onclick="nextPlan()">Nächster Plan</button>
    </div>
</div>

<script>
    // 3 verschiedene Stundenpläne zum Üben (das "окно" wechselt die Positionen)
    const schedules = [
        {
            slots: [
                { num: "1. Пара", time: "08:30", subject: "Русский язык (Russisch)", isWindow: false },
                { num: "2. Пара", time: "10:15", subject: "[ Kein Unterricht ]", isWindow: true },
                { num: "3. Пара", time: "12:00", subject: "История (Geschichte)", isWindow: false },
                { num: "4. Пара", time: "13:45", subject: "Литература (Literatur)", isWindow: false }
            ],
            feedbackCorrect: "✓ Richtig getroffen! Die 2. Doppelstunde ist frei. Das ist ein 'окно'.",
            feedbackWrong: "⚡ Nein, hier findet regulärer Unterricht statt! Such nach der leeren Lücke."
        },
        {
            slots: [
                { num: "1. Пара", time: "08:30", subject: "Математика (Mathematik)", isWindow: false },
                { num: "2. Пара", time: "10:15", subject: "Английский язык (Englisch)", isWindow: false },
                { num: "3. Пара", time: "12:00", subject: "Физика (Physik)", isWindow: false },
                { num: "4. Пара", time: "13:45", subject: "[ Kein Unterricht ]", isWindow: true }
            ],
            feedbackCorrect: "✓ Ausgezeichnet! Das 'окно' liegt ganz am Ende des Tages nach den drei Blöcken.",
            feedbackWrong: "⚡ Falsch. In diesem Block muss gelernt werden. Schau dir die Lücken an."
        },
        {
            slots: [
                { num: "1. Пара", time: "08:30", subject: "Химия (Chemie)", isWindow: false },
                { num: "2. Пара", time: "10:15", subject: "[ Kein Unterricht ]", isWindow: true },
                { num: "3. Пара", time: "12:00", subject: "География (Geographie)", isWindow: false },
                { num: "4. Пара", time: "13:45", subject: "[ Kein Unterricht ]", isWindow: true }
            ],
            // In Plan 3 gibt es theoretisch zwei Lücken, beide zählen als korrektes Fenster
            feedbackCorrect: "✓ Perfekt! Du hast eine Freistunde erwischt. An diesem Tag gibt es sogar zwei davon!",
            feedbackWrong: "⚡ Das ist ein reguläres Fach. Klicke auf eine der unterrichtsfreien Lücken."
        }
    ];

    let currentPlanIndex = 0;
    let hasSelected = false;

    function loadPlan() {
        hasSelected = false;
        const currentData = schedules[currentPlanIndex];
        
        document.getElementById("progress-info").innerText = `Plan ${currentPlanIndex + 1} von ${schedules.length}`;
        document.getElementById("feedback-zone").innerText = "";
        document.getElementById("feedback-zone").className = "feedback-box";
        document.getElementById("next-btn").style.display = "none";

        const timetableBox = document.getElementById("timetable-box");
        timetableBox.innerHTML = "";

        // Generierung der Hotspot-Elemente
        currentData.slots.forEach((slot, index) => {
            const slotDiv = document.createElement("div");
            slotDiv.className = "time-slot";
            slotDiv.id = `slot-${index}`;
            slotDiv.onclick = () => handleHotspotClick(index, slot.isWindow);

            const numDiv = document.createElement("div");
            numDiv.className = "slot-number";
            numDiv.innerHTML = `${slot.num}<span class="slot-time">${slot.time}</span>`;

            const subjectDiv = document.createElement("div");
            subjectDiv.className = "slot-subject";
            subjectDiv.innerText = slot.subject;

            slotDiv.appendChild(numDiv);
            slotDiv.appendChild(subjectDiv);
            timetableBox.appendChild(slotDiv);
        });
    }

    function handleHotspotClick(index, isWindow) {
        if (hasSelected) return; // Klicks nach der Entscheidung sperren

        const currentData = schedules[currentPlanIndex];
        const clickedSlot = document.getElementById(`slot-${index}`);
        const feedbackZone = document.getElementById("feedback-zone");

        // Alle Slots optisch für weitere Klicks einfrieren
        const allSlots = document.querySelectorAll(".time-slot");
        allSlots.forEach(slot => slot.classList.add("disabled"));

        if (isWindow) {
            // ERST NACH DEM KLICK: Richtig getroffen -> Grün färben
            hasSelected = true;
            clickedSlot.classList.remove("disabled");
            clickedSlot.classList.add("correct-hit");
            
            feedbackZone.innerText = currentData.feedbackCorrect;
            feedbackZone.className = "feedback-box success";
            document.getElementById("next-btn").style.display = "block";
        } else {
            // ERST NACH DEM KLICK: Falsch getroffen -> Rot färben
            clickedSlot.classList.add("wrong-hit");
            feedbackZone.innerText = currentData.feedbackWrong;
            feedbackZone.className = "feedback-box error";

            // Nach der Schüttelanimation den Fehler-Zustand entfernen, damit man neu wählen kann
            setTimeout(() => {
                clickedSlot.classList.remove("wrong-hit");
                allSlots.forEach(slot => slot.classList.remove("disabled"));
            }, 300);
        }
    }

    function nextPlan() {
        currentPlanIndex++;
        if (currentPlanIndex < schedules.length) {
            loadPlan();
        } else {
            alert("🎉 Sensationell! Du hast alle Freistunden (окна) in den Stundenplänen fehlerfrei lokalisiert.");
            restartQuiz();
        }
    }

    function restartQuiz() {
        currentPlanIndex = 0;
        loadPlan();
    }

    // Direkt beim Laden starten
    window.onload = loadPlan;
</script>

</body>
</html>
